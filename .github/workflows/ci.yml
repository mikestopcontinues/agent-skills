name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # The action reads `packageManager` from package.json (`pnpm@10.33.0`)
        # and refuses if `version` is also set here — so the package.json pin
        # is the single source of truth.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check = type + lint + test + bundle-drift. check:bundles re-runs
      # `pnpm build` then fails on `git diff --quiet` over bundle dirs — a PR
      # that edits canonical sources without committing the regenerated bundles
      # is blocked here.
      - run: pnpm run check
